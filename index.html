<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Copa Mundial de Fútbol 2026 - Resultados y Bracket Responsive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
  body {
    font-family: 'Roboto', sans-serif;
    background: #f9fafb;
    margin: 20px;
    display: flex;
    justify-content: center;
    min-width: 320px;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 1300px;
  }
  .title-section {
    text-align: center;
    margin-bottom: 30px;
  }
  .title-section img {
    height: 80px;
    margin-bottom: 10px;
    user-select: none;
  }
  .title-section h1 {
    font-weight: 700;
    font-size: 3rem;
    color: #2c3e50;
    margin: 0;
    user-select: none;
  }
  .bracket {
    display: flex;
    gap: 28px;
    background: #ffffff;
    padding: 24px;
    padding-left: 20px;   /* Margen para mostrar bandera al inicio */
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .bracket::-webkit-scrollbar {
    height: 8px;
  }
  .bracket::-webkit-scrollbar-thumb {
    background-color: rgba(0,0,0,0.2);
    border-radius: 4px;
  }
  .round {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 240px; /* más ancho para banderas y texto */
  }
  .round h2 {
    text-align: center;
    margin-bottom: 14px;
    font-size: 1.4rem;
    color: #2c3e50;
    border-bottom: 3px solid #3498db;
    padding-bottom: 8px;
    font-weight: 700;
    letter-spacing: 0.04em;
    user-select: none;
  }
  .match {
    background: #ecf0f1;
    border-radius: 10px;
    padding: 14px 16px;
    text-align: center;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.08);
    position: relative;
    cursor: pointer;
    user-select: none;
    transition: box-shadow 0.3s ease, background-color 0.3s ease;
  }
  .match:hover {
    background-color: #dfe6e9;
    box-shadow: 0 4px 14px rgba(52, 152, 219, 0.3);
  }
  .team {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0;
  }
  .team-name {
    font-weight: 700;
    flex-grow: 1;
    text-align: left;
    margin-left: 10px;
    font-size: 1.05rem;
    color: #34495e;
  }
  .flag {
    width: 32px;
    height: 20px;
    border: 1.2px solid #bdc3c7;
    object-fit: cover;
    border-radius: 4px;
    min-width: 32px;
    min-height: 20px;
  }
  .score {
    font-weight: 700;
    width: 36px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(0,0,0,0.15);
    line-height: 36px;
    font-size: 1.3rem;
    text-align: center;
    color: #2c3e50;
    margin-left: 6px;
  }
  .score-pen {
    font-weight: 600;
    font-size: 0.9rem;
    color: #7f8c8d;
    margin-left: 6px;
    font-style: italic;
  }
  #resultForm {
    display: none;
    background: white;
    max-width: 420px;
    margin: 28px auto;
    padding: 24px 30px;
    border-radius: 12px;
    border: 1px solid #95a5a6;
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    user-select: text;
  }
  #resultForm h2 {
    margin-top: 0;
    margin-bottom: 22px;
    text-align: center;
    font-weight: 700;
    color: #34495e;
    font-size: 1.8rem;
    letter-spacing: 0.02em;
  }
  #resultForm label {
    font-weight: 700;
    display: block;
    margin-top: 18px;
    font-size: 1rem;
    color: #2c3e50;
  }
  #resultForm input[type="number"] {
    width: 80px;
    height: 38px;
    margin-top: 8px;
    font-size: 18px;
    padding-left: 10px;
    box-sizing: border-box;
    border: 1.5px solid #bdc3c7;
    border-radius: 6px;
    transition: border-color 0.3s ease;
  }
  #resultForm input[type="number"]:focus {
    border-color: #2980b9;
    outline: none;
  }
  #resultForm button {
    margin-top: 30px;
    margin-right: 18px;
    padding: 12px 26px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    transition: background-color 0.3s ease;
  }
  #resultForm button.save {
    background-color: #27ae60;
    color: white;
  }
  #resultForm button.save:hover {
    background-color: #229954;
  }
  #resultForm button.cancel {
    background-color: #c0392b;
    color: white;
  }
  #resultForm button.cancel:hover {
    background-color: #962d22;
  }
  .notice {
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.1rem;
    color: #555;
    font-weight: 600;
    user-select: none;
  }

  @media (max-width: 480px) {
    .bracket {
      flex-direction: column;
      gap: 40px;
      overflow-x: unset;
      padding-left: 10px;
    }
    .round {
      min-width: auto;
      width: 100%;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="title-section">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/FIFA_World_Cup_Trophy.svg" alt="Copa Mundial" />
      <h1>Copa Mundial de Fútbol 2026</h1>
    </div>

    <div class="notice">Haz clic en cualquier partido para ingresar o modificar su resultado. Puedes ingresar resultados de penales si el partido termina empatado.</div>

    <div class="bracket">

      <div class="round" id="round32"><h2>Dieciseisavos</h2></div>
      <div class="round" id="round16"><h2>Octavos</h2></div>
      <div class="round" id="quarterfinals"><h2>Cuartos</h2></div>
      <div class="round" id="semifinals"><h2>Semifinales</h2></div>
      <div class="round" id="thirdPlace"><h2>Tercer Puesto</h2></div>
      <div class="round" id="final"><h2>Final</h2></div>

    </div>

    <div id="resultForm">
      <h2>Ingresar Resultado</h2>
      <form id="form">
        <label for="team1Score"><span id="team1Name"></span> - Goles Tiempo Regular/Extra</label>
        <input type="number" min="0" id="team1Score" required />
        <label for="team2Score"><span id="team2Name"></span> - Goles Tiempo Regular/Extra</label>
        <input type="number" min="0" id="team2Score" required />
        <label for="team1Penalties"><span id="team1Name"></span> - Goles en Penales (opcional)</label>
        <input type="number" min="0" id="team1Penalties" />
        <label for="team2Penalties"><span id="team2Name"></span> - Goles en Penales (opcional)</label>
        <input type="number" min="0" id="team2Penalties" />
        <div style="text-align:center;">
          <button type="submit" class="save">Guardar Resultado</button>
          <button type="button" id="cancelBtn" class="cancel">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

<script>
  const dieciseisavos = [
    {id:1,team1:'México',flag1:'https://flagcdn.com/w40/mx.png',team2:'Ecuador',flag2:'https://flagcdn.com/w40/ec.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:2,team1:'España',flag1:'https://flagcdn.com/w40/es.png',team2:'Austria',flag2:'https://flagcdn.com/w40/at.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:3,team1:'Argentina',flag1:'https://flagcdn.com/w40/ar.png',team2:'Cabo Verde',flag2:'https://flagcdn.com/w40/cv.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:4,team1:'Francia',flag1:'https://flagcdn.com/w40/fr.png',team2:'Suecia',flag2:'https://flagcdn.com/w40/se.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:5,team1:'Brasil',flag1:'https://flagcdn.com/w40/br.png',team2:'Japón',flag2:'https://flagcdn.com/w40/jp.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:6,team1:'Inglaterra',flag1:'https://flagcdn.com/w40/gb-eng.png',team2:'RD Congo',flag2:'https://flagcdn.com/w40/cd.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:7,team1:'Países Bajos',flag1:'https://flagcdn.com/w40/nl.png',team2:'Marruecos',flag2:'https://flagcdn.com/w40/ma.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:8,team1:'EE. UU.',flag1:'https://flagcdn.com/w40/us.png',team2:'Bosnia-Herzegovina',flag2:'https://flagcdn.com/w40/ba.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:9,team1:'Sudáfrica',flag1:'https://flagcdn.com/w40/za.png',team2:'Canadá',flag2:'https://flagcdn.com/w40/ca.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:10,team1:'Portugal',flag1:'https://flagcdn.com/w40/pt.png',team2:'Croacia',flag2:'https://flagcdn.com/w40/hr.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:11,team1:'Alemania',flag1:'https://flagcdn.com/w40/de.png',team2:'Paraguay',flag2:'https://flagcdn.com/w40/py.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:12,team1:'Bélgica',flag1:'https://flagcdn.com/w40/be.png',team2:'Senegal',flag2:'https://flagcdn.com/w40/sn.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:13,team1:'Colombia',flag1:'https://flagcdn.com/w40/co.png',team2:'Ghana',flag2:'https://flagcdn.com/w40/gh.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:14,team1:'Suiza',flag1:'https://flagcdn.com/w40/ch.png',team2:'Argelia',flag2:'https://flagcdn.com/w40/dz.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:15,team1:'Noruega',flag1:'https://flagcdn.com/w40/no.png',team2:'Costa de Marfil',flag2:'https://flagcdn.com/w40/ci.png',score1:null,score2:null,pen1:null,pen2:null},
    {id:16,team1:'Australia',flag1:'https://flagcdn.com/w40/au.png',team2:'Egipto',flag2:'https://flagcdn.com/w40/eg.png',score1:null,score2:null,pen1:null,pen2:null}
  ];

  const octavos = [
    { id: 101, srcMatches: [11, 4], team1: null, flag1: null, team2: null, flag2: null, score1:null, score2:null, pen1:null, pen2:null },
    { id: 102, srcMatches: [9, 7],  team1: null, flag1: null, team2: null, flag2: null, score1:null, score2:null, pen1:null, pen2:null },
    { id: 103, srcMatches: [10, 2], team1: null, flag1: null, team2: null, flag2: null, score1:null, score2:null, pen1:null, pen2:null },
    { id: 104, srcMatches: [8, 12], team1: null, flag1: null, team2: null, flag2: null, score1:null, score2:null, pen1:null, pen2:null },
    { id: 105, srcMatches: [5, 15], team1: null, flag1: null, team2: null, flag2: null, score1:null, score2:null, pen1:null, pen2:null },
    { id: 106, srcMatches: [1, 6],  team1: null, flag1: null, team2: null, flag2: null, score1:null, score2:null, pen1:null, pen2:null },
    { id: 107, srcMatches: [3, 16], team1: null, flag1: null, team2: null, flag2: null, score1:null, score2:null, pen1:null, pen2:null },
    { id: 108, srcMatches: [14, 13],team1: null, flag1: null, team2: null, flag2: null, score1:null, score2:null, pen1:null, pen2:null }
  ];

  const cuartos = [
    {id:201, team1:null, flag1:null, team2:null, flag2:null, score1:null, score2:null, pen1:null, pen2:null, srcMatches:[101,102]},
    {id:202, team1:null, flag1:null, team2:null, flag2:null, score1:null, score2:null, pen1:null, pen2:null, srcMatches:[103,104]},
    {id:203, team1:null, flag1:null, team2:null, flag2:null, score1:null, score2:null, pen1:null, pen2:null, srcMatches:[105,106]},
    {id:204, team1:null, flag1:null, team2:null, flag2:null, score1:null, score2:null, pen1:null, pen2:null, srcMatches:[107,108]}
  ];

  const semifinales = [
    {id:301, team1:null, flag1:null, team2:null, flag2:null, score1:null, score2:null, pen1:null, pen2:null, srcMatches:[201,202]},
    {id:302, team1:null, flag1:null, team2:null, flag2:null, score1:null, score2:null, pen1:null, pen2:null, srcMatches:[203,204]}
  ];

  const tercerPuesto = [
    {id:401, team1:null, flag1:null, team2:null, flag2:null, score1:null, score2:null, pen1:null, pen2:null, srcMatches:[301,302], type:'perdedor'}
  ];

  const final = [
    {id:501, team1:null, flag1:null, team2:null, flag2:null, score1:null, score2:null, pen1:null, pen2:null, srcMatches:[301,302], type:'ganador'}
  ];

  const round32Div = document.getElementById('round32');
  const round16Div = document.getElementById('round16');
  const quartersDiv = document.getElementById('quarterfinals');
  const semifinalsDiv = document.getElementById('semifinals');
  const thirdPlaceDiv = document.getElementById('thirdPlace');
  const finalDiv = document.getElementById('final');

  const resultForm = document.getElementById('resultForm');
  const form = document.getElementById('form');
  const team1Name = document.getElementById('team1Name');
  const team2Name = document.getElementById('team2Name');
  const team1Score = document.getElementById('team1Score');
  const team2Score = document.getElementById('team2Score');
  const team1Penalties = document.getElementById('team1Penalties');
  const team2Penalties = document.getElementById('team2Penalties');
  const cancelBtn = document.getElementById('cancelBtn');

  let currentMatch = null;

  const STORAGE_KEY = 'mundial2026Penales';

  function saveData() {
    const data = { dieciseisavos, octavos, cuartos, semifinales, tercerPuesto, final };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        const data = JSON.parse(raw);
        ['dieciseisavos', 'octavos', 'cuartos', 'semifinales', 'tercerPuesto', 'final'].forEach(key => {
          if (Array.isArray(data[key])) {
            data[key].forEach(savedMatch => {
              const arr = eval(key);
              const m = arr.find(x => x.id === savedMatch.id);
              if (m) {
                m.team1 = savedMatch.team1 ?? m.team1;
                m.flag1 = savedMatch.flag1 ?? m.flag1;
                m.team2 = savedMatch.team2 ?? m.team2;
                m.flag2 = savedMatch.flag2 ?? m.flag2;
                m.score1 = savedMatch.score1;
                m.score2 = savedMatch.score2;
                m.pen1 = savedMatch.pen1 ?? null;
                m.pen2 = savedMatch.pen2 ?? null;
              }
            });
          }
        });
      } catch (e) {
        console.warn('Error cargando datos:', e);
      }
    }
  }

  function getAdvancing(match, type = 'ganador') {
    if (match.score1 === null || match.score2 === null) return null;
    if (match.score1 > match.score2) return { team: match.team1, flag: match.flag1 };
    if (match.score2 > match.score1) return { team: match.team2, flag: match.flag2 };
    // Empate en tiempo regular/extra, verificar penales
    if (type === 'ganador') {
      if (match.pen1 !== null && match.pen2 !== null) {
        if (match.pen1 > match.pen2) return { team: match.team1, flag: match.flag1 };
        if (match.pen2 > match.pen1) return { team: match.team2, flag: match.flag2 };
      }
      return null; // empate si no hay penales
    } else if (type === 'perdedor') {
      if (match.pen1 !== null && match.pen2 !== null) {
        if (match.pen1 < match.pen2) return { team: match.team1, flag: match.flag1 };
        if (match.pen2 < match.pen1) return { team: match.team2, flag: match.flag2 };
      }
      return null;
    }
    return null;
  }

  function updateNextRound(nextRound, prevRound) {
    nextRound.forEach(nextMatch => {
      const [src1, src2] = nextMatch.srcMatches;
      const m1 = prevRound.find(m => m.id === src1);
      const m2 = prevRound.find(m => m.id === src2);
      const adv1 = getAdvancing(m1, nextMatch.type || 'ganador');
      const adv2 = getAdvancing(m2, nextMatch.type || 'ganador');
      if (adv1) {
        nextMatch.team1 = adv1.team;
        nextMatch.flag1 = adv1.flag;
      } else {
        nextMatch.team1 = null;
        nextMatch.flag1 = null;
      }
      if (adv2) {
        nextMatch.team2 = adv2.team;
        nextMatch.flag2 = adv2.flag;
      } else {
        nextMatch.team2 = null;
        nextMatch.flag2 = null;
      }
      if (!nextMatch.team1 || !nextMatch.team2) {
        nextMatch.score1 = null;
        nextMatch.score2 = null;
        nextMatch.pen1 = null;
        nextMatch.pen2 = null;
      }
    });
  }

  function renderMatches(container, matches) {
    container.querySelectorAll('.match').forEach(el => el.remove());
    matches.forEach(m => {
      const div = document.createElement('div');
      div.className = 'match';
      div.dataset.id = m.id;
      let s1 = m.score1 !== null ? m.score1 : '-';
      let s2 = m.score2 !== null ? m.score2 : '-';
      if (!m.team1) s1 = '-';
      if (!m.team2) s2 = '-';
      let penInfo1 = '';
      let penInfo2 = '';
      if (m.pen1 !== null && m.pen2 !== null) {
        penInfo1 = `<span class="score-pen">(${m.pen1})</span>`;
        penInfo2 = `<span class="score-pen">(${m.pen2})</span>`;
      }
      div.innerHTML = `
        <div class="team">
          ${m.flag1 ? `<img class="flag" src="${m.flag1}" alt="${m.team1}">` : ''}
          <span class="team-name">${m.team1 || 'Por definir'}</span>
          <span class="score">${s1}</span>${penInfo1}
        </div>
        <div class="team">
          ${m.flag2 ? `<img class="flag" src="${m.flag2}" alt="${m.team2}">` : ''}
          <span class="team-name">${m.team2 || 'Por definir'}</span>
          <span class="score">${s2}</span>${penInfo2}
        </div>
      `;
      if (m.team1 && m.team2) {
        div.style.cursor = 'pointer';
        div.addEventListener('click', () => openResultForm(m, container));
      } else {
        div.style.cursor = 'default';
      }
      container.appendChild(div);
    });
  }

  function openResultForm(match, container) {
    currentMatch = { match, container };
    team1Name.textContent = match.team1;
    team2Name.textContent = match.team2;
    team1Score.value = match.score1 !== null ? match.score1 : '';
    team2Score.value = match.score2 !== null ? match.score2 : '';
    team1Penalties.value = match.pen1 !== null ? match.pen1 : '';
    team2Penalties.value = match.pen2 !== null ? match.pen2 : '';
    resultForm.style.display = 'block';
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    let s1 = parseInt(team1Score.value);
    let s2 = parseInt(team2Score.value);
    let p1 = team1Penalties.value === '' ? null : parseInt(team1Penalties.value);
    let p2 = team2Penalties.value === '' ? null : parseInt(team2Penalties.value);

    if (isNaN(s1) || isNaN(s2)) {
      alert('Ingresa goles válidos para el tiempo normal.');
      return;
    }
    if ((p1 !== null && isNaN(p1)) || (p2 !== null && isNaN(p2))) {
      alert('Ingresa goles válidos para penales o deja vacío.');
      return;
    }
    currentMatch.match.score1 = s1;
    currentMatch.match.score2 = s2;
    currentMatch.match.pen1 = p1;
    currentMatch.match.pen2 = p2;

    const c = currentMatch.container;
    if (c === round32Div) {
      updateNextRound(octavos, dieciseisavos);
      updateNextRound(cuartos, octavos);
      updateNextRound(semifinales, cuartos);
      updateNextRound(tercerPuesto, semifinales);
      updateNextRound(final, semifinales);
    } else if (c === round16Div) {
      updateNextRound(cuartos, octavos);
      updateNextRound(semifinales, cuartos);
      updateNextRound(tercerPuesto, semifinales);
      updateNextRound(final, semifinales);
    } else if (c === quartersDiv) {
      updateNextRound(semifinales, cuartos);
      updateNextRound(tercerPuesto, semifinales);
      updateNextRound(final, semifinales);
    } else if (c === semifinalsDiv) {
      updateNextRound(tercerPuesto, semifinales);
      updateNextRound(final, semifinales);
    }
    saveData();
    renderAll();
    resultForm.style.display = 'none';
  });

  cancelBtn.addEventListener('click', () => {
    resultForm.style.display = 'none';
  });

  function renderAll() {
    renderMatches(round32Div, dieciseisavos);
    renderMatches(round16Div, octavos);
    renderMatches(quartersDiv, cuartos);
    renderMatches(semifinalsDiv, semifinales);
    renderMatches(thirdPlaceDiv, tercerPuesto);
    renderMatches(finalDiv, final);
  }

  loadData();
  updateNextRound(octavos, dieciseisavos);
  updateNextRound(cuartos, octavos);
  updateNextRound(semifinales, cuartos);
  updateNextRound(tercerPuesto, semifinales);
  updateNextRound(final, semifinales);
  renderAll();
</script>
</body>
</html>
